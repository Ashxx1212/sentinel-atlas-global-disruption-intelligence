name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck EONET Edge Function
        run: deno check --node-modules-dir=auto --import-map=supabase/functions/sync-eonet-events/deno.json supabase/functions/sync-eonet-events/index.ts

      - name: Run EONET Deno tests
        run: deno test --allow-env --no-prompt --import-map=supabase/functions/sync-eonet-events/deno.json supabase/functions/sync-eonet-events
